name: Build CAPY TUI

on:
  push:
    branches:
      - main
      - "release/**"
      - "feature/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14.5"
          cache: "pip"

      - name: Install & build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run tests
        run: |
          python -m pytest

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: capy-tui-linux-amd64
            release_name: capy-tui-linux-amd64
            executable_path: capy-tui-linux-amd64

          - os: windows-latest
            artifact_name: capy-tui-windows-amd64
            release_name: capy-tui-windows-amd64.exe
            executable_path: capy-tui-windows-amd64.exe

          - os: macos-latest
            artifact_name: capy-tui-macos-arm64
            release_name: capy-tui-macos-arm64
            executable_path: capy-tui-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14.5"
          cache: "pip"

      - name: Install & build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Build executable
        shell: bash
        run: |
          python -m pyinstaller \
          --clean \
          --onefile \
          --name capy-tui \
          --add-data "src/capy_tui/styles:styles" src/capy_tui/app.py

      - name: Rename executable
        shell: bash
        run: |
          echo "Listing dist folder before rename:"
          ls -la dist/

          if [ -f "dist/capy-tui.exe" ]; then
            mv dist/capy-tui.exe "${{ matrix.release_name }}"
            echo "Renamed capy-tui.exe to ${{ matrix.release_name }}"
          elif [ -f "dist/capy_tui" ]; then
            mv dist/capy-tui "${{ matrix.release_name }}"
            echo "Renamed capy-tui to ${{ matrix.release_name }}"
          else
            echo "ERROR: No executable found in dist!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.executable_path }}
          retention-days: 90

  release:
    permissions:
      contents: write
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, "refs/tags/")

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            capy-tui-linux-amd64/capy-tui-linux-amd64
            capy-tui-windows-amd64/capy-tui-windows-amd64.exe
            capy-tui-macos-arm64/capy-tui-macos-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
